version: "3.9"

services:
  sms-finance-llm:
    build: .
    container_name: sms-finance-llm
    ports:
      - "8080:8080"   # llama.cpp server
      - "9050:9050"   # FastAPI app
    env_file:
      - .env
    environment:
      - LLAMA_PORT=8080
      - LLM_BASE_URL=http://localhost:8080/v1
      - LLM_MODEL=qwen2.5-1.5b-instruct
      - LLM_PROVIDER=openai-compatible
    restart: unless-stopped
