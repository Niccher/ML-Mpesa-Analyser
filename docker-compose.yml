version: "3.9"

services:
  ml-mpesa-analyzer:
    build: .
    container_name: ${CONTAINER_ML_MPESA_ANALYZER:-ml-mpesa-analyzer}
    ports:
      - "${ML_MPESA_ANALYZER_LLAMA_PORT:-9022}:8080"
      - "${ML_MPESA_ANALYZER_API_PORT:-9021}:9050"
    image: ${IMAGE_ML_MPESA_ANALYZER:-ml-mpesa-analyzer}
    env_file:
      - .env
    environment:
      - LLAMA_PORT=8080
      - LLM_BASE_URL=http://localhost:8080/v1
      - LLM_MODEL=qwen2.5-1.5b-instruct
      - LLM_PROVIDER=openai-compatible
    restart: unless-stopped
    networks:
      - ${NETWORK_NAME:-hosts-shared-network}

networks:
  hosts-shared-network:
    name: ${NETWORK_NAME:-hosts-shared-network}
    external: true
